# How the built app is served.
#
# The whole file exists for one line — the `try_files` in the location block
# below. Everything else is cache policy.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Dokploy's Traefik terminates TLS and forwards here over plain HTTP, so
    # this server block deliberately speaks HTTP only. Redirecting to HTTPS in
    # here would loop.

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── Hashed build output ──────────────────────────────────────────
    #
    # Vite fingerprints these filenames, so a changed file is a *different*
    # file. They can be cached for a year and never revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts, same reasoning — and they must never leave the origin,
    # which is why they are in the repo rather than on a CDN.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html: never cached ─────────────────────────────────────
    #
    # It is the only file whose name does not change between deploys, and it is
    # the one that names the hashed chunks. A cached copy points at chunk files
    # that no longer exist, which is precisely the stale-chunk failure the app's
    # ErrorBoundary has a "reload the page" branch for. Better not to cause it.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Everything else falls back to the app ────────────────────────
    #
    # THE line. This is a single-page app: the server has no file called
    # `reset-password`, `login` or `account` — the router makes those up in the
    # browser. Without this fallback, opening any of them *directly* returns
    # 404, and "directly" is exactly how someone arrives from a password-reset
    # email. It does not show up in local development because Vite's dev server
    # does this for you.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ─────────────────────────────────────────────
    #
    # `always` on every one of them: without it nginx omits the header on error
    # responses, which are exactly the responses an attacker is most interested
    # in shaping.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nothing here is meant to be embedded. X-Frame-Options for old browsers,
    # `frame-ancestors` below for current ones — the CSP directive wins where
    # both are understood.
    add_header X-Frame-Options "DENY" always;

    # No `includeSubDomains`. The zone still has a wildcard A record pointing at
    # the old host, so subdomains are served by machines this container knows
    # nothing about; forcing HTTPS on them from here would break something we
    # cannot see. Revisit once that wildcard is gone.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Features the app does not use. Denying them costs nothing and shrinks
    # what a successful script injection could reach for.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # ── Content Security Policy ──────────────────────────────────────
    #
    # Strict because the app earns it: no third-party scripts, no CDN fonts, no
    # analytics, no Stripe.js. Checkout is a top-level redirect to stripe.com,
    # not an embed, so no Stripe origin needs to appear here.
    #
    # Two deliberate loosenings:
    #   'unsafe-inline' in style-src — Framer Motion animates by writing inline
    #     style attributes, and Tailwind emits an inline critical block. There
    #     is no nonce path for that in a static build.
    #   blob: in worker-src and img-src — Three.js and canvas exports use blob
    #     URLs. Same-origin blobs, not a remote fetch.
    #
    # connect-src is a wildcard over supabase.co rather than the one project
    # URL because that URL is a build argument: hard-coding it here would mean
    # a config change every time the project moves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}
