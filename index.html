<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#070809" />

    <!-- Home-screen install, without a service worker.
         The manifest gives the app an icon, a name and its own window; it
         does not make it start offline, and nothing here caches a build. A
         caching worker in front of a site that deploys often is how people
         get stuck on an old one. Every prerendered page is cut from this
         file, so all of them carry these lines. Icons: scripts/generate-icons.mjs. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Blackjack" />

    <!-- The ground colour, before the stylesheet.
         Without it the document is white until the CSS has arrived, and a
         dark site opened on a white flash. The second rule belongs to
         /boot.js below: it keeps a prerendered page invisible in the one case
         where it is in the wrong language for this visitor. The next two hide
         the prerendered cookie bar (beside #root) for a visitor with nothing
         to answer and, like the page, while it is held — both decided by
         /boot.js; without JavaScript there is nothing to count and
         nothing that could take the answer, so the bar is not shown at all. -->
    <style>
      html { background: #070809; color-scheme: dark; }
      html[data-boot='hold'] #root { visibility: hidden; }
      html[data-consent] [data-boot-banner] { display: none; }
      html[data-boot='hold'] [data-boot-banner] { visibility: hidden; }
    </style>
    <noscript><style>[data-boot-banner] { display: none; }</style></noscript>
    <script src="/boot.js"></script>

    <!-- The display face, preloaded.
         The loading screen is the first thing painted and its typography is
         half of what it is, so the font cannot arrive late. Same origin,
         subset to latin, ~15kB per weight — it is in cache before React has
         finished mounting, which is what makes a real typeface usable on a
         screen that exists precisely because things are still loading. -->
    <!-- Inter is the interface face on every screen, so it is preloaded too;
         self-hosted since the Google Fonts import was removed.
         The two Instrument Sans lines stay in the app shell only:
         scripts/prerender.mjs drops them from the public pages, which never
         use the display face (it is the loading screen's and the level-up's),
         so on a slow line they only competed with the page's own requests. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin />

    <title>Blackjack Trainer — Hi-Lo Card Counting &amp; Basic Strategy</title>
    <!-- Kept under ~155 characters so search results don't truncate it. -->
    <meta
      name="description"
      content="Blackjack trainer, free to start: practise basic strategy and Hi-Lo card counting with timed drills, a full casino table and stats that find your leaks."
    />

    <!-- Link previews (Slack, Discord, X, LinkedIn, iMessage).
         Absolute URLs, not relative: several crawlers refuse a relative
         og:image and fall back to a text-only card, which is what happened
         while this said "your-domain". -->
    <link rel="canonical" href="https://black-jack-training.com/" />
    <meta property="og:url" content="https://black-jack-training.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blackjack Trainer" />
    <meta property="og:title" content="Blackjack Trainer — Hi-Lo Card Counting &amp; Basic Strategy" />
    <meta
      property="og:description"
      content="Timed drills, the Illustrious 18, a full casino table and analytics that show exactly where your advantage leaks."
    />
    <meta property="og:image" content="https://black-jack-training.com/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
