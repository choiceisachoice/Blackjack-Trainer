<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#070809" />

    <!-- The display face, preloaded.
         The loading screen is the first thing painted and its typography is
         half of what it is, so the font cannot arrive late. Same origin,
         subset to latin, ~15kB per weight — it is in cache before React has
         finished mounting, which is what makes a real typeface usable on a
         screen that exists precisely because things are still loading. -->
    <link rel="preload" href="/fonts/instrument-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin />

    <title>Blackjack Card Counting Trainer — Learn Hi-Lo Properly</title>
    <!-- Kept under ~155 characters so search results don't truncate it. -->
    <meta
      name="description"
      content="Train Hi-Lo card counting properly: timed drills, every basic-strategy hand, the Illustrious 18, a full casino table and analytics that find your leaks."
    />

    <!-- Link previews (Slack, Discord, X, LinkedIn, iMessage).
         NOTE at deploy: add absolute URLs once the domain is live —
           <meta property="og:url" content="https://your-domain/" />
         and make og:image absolute too. Some crawlers refuse relative image
         paths, so the card falls back to text-only until then. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blackjack Trainer" />
    <meta property="og:title" content="Blackjack Card Counting Trainer — Learn Hi-Lo Properly" />
    <meta
      property="og:description"
      content="Timed drills, the Illustrious 18, a full casino table and analytics that show exactly where your advantage leaks."
    />
    <meta property="og:image" content="/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
